<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Spotify MVP Dashboard</title>
    <!-- Bootstrap CSS -->
    <!-- Bootstrap CSS sem SRI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>

    <style>
        body {
            padding-top: 2rem;
        }

        .tab-content {
            margin-top: 1rem;
        }

        #resPredict {
            font-weight: 600;
            margin-top: .5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="mb-4 text-center">Spotify MVP Dashboard</h1>

        <!-- Nav tabs -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabPredict" type="button"
                    role="tab">
                    Classificar Faixas
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPlatform" type="button" role="tab">
                    Comparação entre Plataformas
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabArtist" type="button" role="tab">
                    Impacto de Artistas
                </button>
            </li>
        </ul>

        <!-- Tab panes -->
        <div class="tab-content">

            <!-- Classificar -->
            <div class="tab-pane fade show active" id="tabPredict" role="tabpanel">
                <!-- <h2 class="mt-3">Classificar Faixa</h2> -->
                <fieldset>
                    <legend>Classificar Faixa</legend>

                    <form id="frmPredict" class="row g-3">
                        <!-- Campos injetados pelo JS -->
                    </form>
                    <div class="mt-3">
                        <button id="btnPredict" class="btn btn-primary">Prever</button>
                        <span id="resPredict" class="ms-3"></span>
                    </div>
                </fieldset>
            </div>

            <!-- Platform Comparison -->
            <div class="tab-pane fade" id="tabPlatform" role="tabpanel">
                <h2 class="mt-3">Platform Comparison</h2>
                <div id="heatmap" class="mt-4" style="width:100%;height:600px;"></div>
            </div>

            <!-- Artist Impact -->
            <div class="tab-pane fade" id="tabArtist" role="tabpanel">
                <h2 class="mt-3">Artist Impact</h2>
                <div id="bubble1" class="mt-4" style="width:100%;height:400px;"></div>
                <div id="bubble2" class="mt-4" style="width:100%;height:400px;"></div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS sem SRI -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = "http://127.0.0.1:5000";

        async function setupTrackClassification() {
            const form = document.getElementById("frmPredict");
            const res = document.getElementById("resPredict");
            const btn = document.getElementById("btnPredict");

            let fields = [];
            try {
                fields = await fetch(`${API}/predict-schema`).then(r => r.json());
            } catch (err) {
                alert("Erro ao buscar schema: " + err);
                return;
            }

            fields.forEach(f => {
                const col = document.createElement("div");
                col.className = "col-md-4 col-lg-2";
                
                const label = document.createElement("label");
                label.className = "form-label";
                label.innerText = f;

                const inp = document.createElement("input");
                inp.name = f;
                inp.type = "number";
                inp.className = "form-control";
                inp.required = true;
                inp.placeholder = "";

                col.append(label, inp);
                form.append(col);
            });

            btn.disabled = true;

            const inputs = form.querySelectorAll("input");

            inputs.forEach(input => {
                input.addEventListener("input", () => {
                btn.disabled = !form.checkValidity();
                });
            });

            btn.addEventListener("click", async e => {
                e.preventDefault();
                res.innerText = "Aguardando predição…";
                btn.disabled = true;

                const data = Object.fromEntries(new FormData(form));

                try {
                    const { classified, error } = await fetch(`${API}/predict-explicit`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    }).then(r => r.json());

                    console.log(classified);

                    if (error) {
                        res.innerText = "Erro: " + error;
                        res.className = "text-danger";
                    } else {
                        res.innerText = classified ? "🚨 Explícito" : "✅ Não Explícito";
                        res.className = classified ? "text-danger" : "text-success";
                    }
                } catch (err) {
                    res.innerText = "Falha na requisição: " + err;
                    res.className = "text-warning";
                } finally {
                    btn.disabled = false;
                }
            });
        }

        async function setupPlatformComparision() {
            try {
                const corr = await fetch(`${API}/platform-correlation`).then(r => r.json());
                const keys = Object.keys(corr);
                const z = keys.map(i => Object.values(corr[i]));
                Plotly.newPlot("heatmap", [{
                    z, x: keys, y: keys, type: "heatmap", colorscale: "Viridis"
                }], {
                    margin: { t: 40, l: 80 },
                    title: "Correlação entre Plataformas"
                });
            } catch (err) {
                document.getElementById("heatmap").innerText = "Erro: " + err;
            }
        }

        async function setupArtistImpact() {
            try {
                const data = await fetch(`${API}/artist-impact`).then(r => r.json());
                const names = data.map(d => d.Artist);
                const tracks = data.map(d => d.num_tracks);
                const streams = data.map(d => d.total_streams);
                const pops = data.map(d => d.avg_popularity);

                Plotly.newPlot("bubble1", [{
                    x: tracks, y: streams, text: names, mode: "markers",
                    marker: { size: pops.map(v => v * 2), sizemode: "area" }
                }], { title: "#Faixas vs Streams Totais" });

                Plotly.newPlot("bubble2", [{
                    x: pops, y: streams, text: names, mode: "markers",
                    marker: { size: tracks.map(v => v * 4), color: "green", sizemode: "area" }
                }], { title: "Popularidade Média vs Streams Totais" });
            } catch (err) {
                document.getElementById("bubble1").innerText = "Erro: " + err;
            }
        }

        setupTrackClassification();
        setupPlatformComparision();
        setupArtistImpact();
    </script>
</body>

</html>
